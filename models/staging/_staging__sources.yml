version: 2

# Fuentes consolidadas del portfolio: declaradas UNA sola vez acá y
# reutilizadas por los 3 proyectos (canibalizacion, top_300, mayoristas)
# vía staging/. Antes de esto, cada proyecto tenía su propia copia de
# estas tablas apuntadas desde SQL suelto o notebooks directamente
# contra dbo.
#
# Lo único que el cliente/proveedor de datos entrega directo es
# Ventas_Ahorrazo, Clientes y productos. Las demás tablas dbo.* que
# existían (clientes_mapeo, clientes_limpio, entre otras) las generaban
# procesos legacy (stored procs, KNIME, scripts sueltos), no el
# proveedor, y se reemplazaron por modelos de este proyecto: ninguna de
# las dos queda declarada acá. clientes_limpio se dio de baja con
# stg_clientes_limpio repuntando a int_clientes_limpio, y clientes_mapeo
# con stg_clientes_mapeo repuntando a int_clientes_mapeo_limpio, los dos
# desde la Fase 2 (confirmada). Los analyses que comparaban contra esas
# dos tablas (validar_clientes_mapeo_limpio.sql, validar_tipo_persona.sql)
# ya cumplieron su función y se eliminaron junto con la fuente.

sources:
  - name: dato_solutions
    schema: dbo
    description: >
      Base replicada de producción provista por el cliente. Contención de
      recursos con otros pipelines pesados (forecast) mitigada en Fase 0.5
      vía Pool de Airflow.
    tables:
      - name: Ventas_Ahorrazo
        description: >
          Fact de ventas transaccional, 238M+ filas. HEAP sin Columnstore
          Index — fix candidato en Fase 0, independiente de dbt.
        # Alerta de frescura -- ya no usa `dbt source freshness` (umbral
        # relativo tipo "hace N días", no soporta un corte de calendario).
        # El chequeo real vive en tests/assert_ventas_actualizada_mes_cerrado.sql
        # (severity: warn -- reutiliza fecha_corte_mes_cerrado()): compara
        # fecha_venta contra el último día del mes cerrado más reciente,
        # que es lo que de verdad les importa a los 3 marts del portfolio.
        # Corre vía `dbt test --select assert_ventas_actualizada_mes_cerrado`
        # desde dbt_ahorrazo_diario (Airflow) -- ver check_freshness.py.
        columns:
          - name: cliente_id
            description: Identificador de cliente tal como llega de origen (tipo inconsistente con clientes_mapeo.cliente_id, normalizado en stg_clientes_mapeo).
          - name: producto_id
          - name: pdv_id
            description: Identificador de punto de venta/sucursal.
          - name: fecha_venta
          - name: venta_gs
          - name: unidades
          - name: timbrado
          - name: factura_nro
          - name: medio_pago

      - name: Clientes
        description: >
          Tabla cruda de clientes. Insumo de int_clientes_normalizados, que
          alimenta a su vez int_clientes_limpio e int_clientes_mapeo_limpio
          -- reemplazan al stored proc legacy sp_refresh_clientes_mapeo_limpio
          y a las tablas dbo.clientes_mapeo/dbo.clientes_limpio que
          generaba (dadas de baja como source acá, ver
          stg_clientes_mapeo/stg_clientes_limpio).
        columns:
          - name: cliente_id
          - name: ci_ruc
          - name: nombre
          - name: celular
          - name: mail

      - name: productos
        description: >
          Catálogo de productos. Usado para filtrar por empresa y excluir
          categorías (bolsas, egresos, servicios) vía int_ventas_elegibles,
          y como fuente de atributos de producto (nombre, marca, categorías,
          unidad de medida) para tableros que antes no tenían esta info --
          ver stg_productos.
        columns:
          - name: producto_id
          - name: id_empresa
          - name: categoria_1
          - name: categoria_2
          - name: categoria_3
          - name: categoria_4
          - name: categoria_5
          - name: nonbre
            description: Nombre del producto -- así está escrito en el origen (typo real, no un error de transcripción). Se corrige a "nombre" en stg_productos.
          - name: marca
          - name: unidad_medida
