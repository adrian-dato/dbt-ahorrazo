version: 2

models:
  - name: stg_clientes_mapeo
    description: >
      Mapeo cliente_id -> cliente_id_limpio. Repunta a
      int_clientes_mapeo_limpio desde la Fase 2 (confirmada) -- ya no lee
      de dbo.clientes_mapeo. Nombre y columnas sin cambios a propósito
      con el cutover: los 3 proyectos que lo consumen no necesitaron
      tocar nada.
    columns:
      - name: cliente_id
        tests:
          - not_null
      - name: cliente_id_limpio
        tests:
          - not_null

  - name: stg_productos
    description: >
      1:1 sobre dbo.productos (columnas de negocio, no todo el catálogo).
      Contract enforced -- mismo motivo que stg_ventas (ver ahí). Tipos
      confirmados contra INFORMATION_SCHEMA de dbo.Productos.
    config:
      contract:
        enforced: true
    columns:
      - name: producto_id
        data_type: varchar(100)
        tests:
          - not_null
          - unique
      - name: id_empresa
        data_type: bigint
      - name: categoria_1
        data_type: varchar(max)
      - name: categoria_2
        data_type: varchar(max)
      - name: categoria_3
        data_type: varchar(max)
      - name: categoria_4
        data_type: varchar(max)
      - name: categoria_5
        data_type: varchar(max)
      - name: nombre
        description: dbo.Productos.nonbre (typo real del origen) renombrado acá.
        data_type: varchar(max)
      - name: marca
        data_type: varchar(max)
      - name: unidad_medida
        data_type: varchar(max)

  - name: stg_ventas
    description: >
      1:1 sobre dbo.Ventas_Ahorrazo. Contract enforced: si el tipo real
      de una columna cambia en la fuente (o alguien saca un cast sin
      querer), dbt falla acá mismo en el build, en vez de que aparezca
      como un error de conversión río abajo en algún mart. Se agregó por
      el error real 245/248: producto_id no es puramente numérico (ej.
      "1685-G", o supera el rango de int como "7506295378"), y un seed
      inferido como int sobre esa columna hacía que SQL Server intentara
      convertir este lado primero por precedencia de tipos y explotara
      (mismo motivo del cast a varchar en stg_productos).
    config:
      contract:
        enforced: true
    columns:
      - name: cliente_id
        data_type: varchar(255)
        tests:
          - not_null
      - name: producto_id
        data_type: varchar(100)
        tests:
          - not_null
      - name: pdv_id
        data_type: varchar(255)
      - name: fecha_venta
        data_type: date
      - name: venta_gs
        data_type: float
      - name: unidades
        data_type: float
      - name: timbrado
        data_type: varchar(255)
      - name: factura_nro
        data_type: varchar(255)
      - name: medio_pago
        data_type: varchar(255)
        description: >
          Cómo pagó esa línea (Efectivo, Tarjeta de crédito, Ueno-Tarjeta,
          Cobro QR Dinelco, etc. -- 34 valores distintos en la fuente, 401
          filas en NULL sobre 238M+). Atributo de línea, igual que
          venta_gs o unidades -- no se resuelve a nivel de ticket acá.
          Verificado contra datos reales: solo 1 ticket de 5,2M (últimos
          13 meses) tiene más de un medio_pago entre sus líneas, así que
          no hace falta una regla de resolución para exponerla a nivel de
          factura si algún consumidor lo necesitara más adelante.

  - name: stg_clientes_limpio
    description: Dimensión por cliente_id_limpio. Repunta a int_clientes_limpio desde la Fase 2 (confirmada) -- ya no lee de dbo.clientes_limpio. Mismo motivo de mantener nombre/columnas que stg_clientes_mapeo.
    columns:
      - name: cliente_id_limpio
        tests:
          - not_null

  - name: stg_clientes
    description: 1:1 sobre dbo.Clientes (tabla cruda). Insumo de int_clientes_normalizados -- no consumido directamente por ningún mart.
    columns:
      - name: cliente_id
        tests:
          - not_null
