version: 2

models:
  - name: dim_cliente
    description: >
      Una fila por cliente_id_limpio, con su identidad y las etiquetas que les
      ponen los análisis. Incluye a todos los clientes del mapeo, también los
      que compran pero nunca se dieron de alta en dbo.Clientes: esos salen con
      nombre '(sin ficha)' y tiene_ficha en 0. Es la tabla que se une para ver
      quién es un cliente y en qué segmento quedó. Está al final de la cadena:
      depende de los análisis y ningún análisis la lee, porque si no dbt
      encontraría una dependencia circular. Los análisis leen la identidad de
      int_clientes_limpio. No trae celular ni mail, que son datos personales;
      quien los necesita los toma de int_clientes_limpio. Las etiquetas son
      las vigentes: la historia de la clasificación de Mayoristas está en
      snapshots.mayoristas_v3_resumen_snapshot.
    columns:
      - name: cliente_id_limpio
        tests:
          - not_null
          - unique
      - name: nombre
        tests:
          - not_null
      - name: documento
        description: Documento (cédula o RUC) limpio. Vacío para los clientes sin ficha.
      - name: tipo_persona
        description: Físico o Jurídico, según la estructura del documento. Se calcula para todos, tengan ficha o no.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Fisico', 'Juridico']
      - name: tiene_ficha
        description: 1 si el cliente figura en dbo.Clientes, 0 si solo aparece en las ventas.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: nivel_mayorista
        description: >
          Alto, Medio, Potencial o Minorista según la clasificación de
          Mayoristas, o Sin clasificar si el cliente no compró en los últimos
          12 meses cerrados.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Alto', 'Medio', 'Potencial', 'Minorista', 'Sin clasificar']
      - name: segmento_mayorista
        description: >
          Mayoristas (el nivel Alto) o Minoristas (el resto), o Sin clasificar
          si no compró en los últimos 12 meses cerrados. Es la columna que
          separa la segmentación RFM.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Mayoristas', 'Minoristas', 'Sin clasificar']
      - name: frecuencia_compra
        description: Cada cuánto viene el cliente, según Mayoristas, o Sin clasificar si no compró en la ventana.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Semanal', 'Quincenal', 'Mensual', 'Esporádico', 'Visita única', 'Sin datos', 'Sin clasificar']

  - name: dim_categoria
    description: >
      Las categorías de producto con un código único por categoría, una
      fila por categoría de cada nivel (1 a 4). El nombre de una categoría
      no la identifica: 'Dama' está bajo 81 categoria_3 distintas, y 8
      nombres de categoria_2, 99 de categoria_3 y 324 de categoria_4 se
      repiten bajo más de un padre. categoria_key es el hash de la ruta
      completa, así que dos categorías con el mismo nombre y distinto
      padre tienen claves distintas. Es el árbol que se usa para analizar
      y pronosticar por categoría, y la tabla donde se leen los nombres de
      las claves que trae int_productos_limpio. Ver
      macros/clave_categoria.sql.
    columns:
      - name: categoria_key
        description: >
          Código de la categoría: nivel y 12 caracteres hexadecimales del
          hash de la ruta, por ejemplo N3-9F2A41C07B3D.
        tests:
          - not_null
          - unique
      - name: nivel
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false
      - name: categoria_padre_key
        description: Vacía en el nivel 1. En los demás, la clave de la categoría del nivel anterior.
        tests:
          - relationships:
              arguments:
                to: ref('dim_categoria')
                field: categoria_key
      - name: ruta
        description: La ruta legible, por ejemplo 'Tienda > Ropa > Remeras > Dama'.
        tests:
          - not_null
      - name: cant_productos
        tests:
          - not_null

  - name: fct_ventas_diarias_categoria_36m
    description: >
      Venta diaria por sucursal y categoría de producto de nivel 4, sobre la
      ventana de {{ var('ventana_meses_36m') }} meses cerrados. Lee
      int_ventas_elegibles (la venta válida) e int_productos_limpio (la
      clave de categoría de cada producto). Trae la clave de los cuatro
      niveles, así que subir de nivel es agrupar por otra columna; los
      nombres se leen uniendo con dim_categoria. Solo trae medidas que se
      suman de un nivel a otro (venta_gs y lineas). Incremental: en corridas
      normales reprocesa los últimos {{ var('meses_lookback_incremental') }}
      meses cerrados completos, y un post_hook borra los días que salen de
      la ventana.
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [fecha_venta, pdv_id, categoria_key_n4]
          config:
            severity: warn
            where: "fecha_venta >= dateadd(month, -3, getdate())"
    columns:
      - name: fecha_venta
        tests:
          - not_null
      - name: pdv_id
        tests:
          - not_null
      - name: categoria_key_n1
        tests:
          - not_null
      - name: categoria_key_n2
        tests:
          - not_null
      - name: categoria_key_n3
        tests:
          - not_null
      - name: categoria_key_n4
        description: >
          Categoría de nivel 4 identificada por su ruta completa. Un producto
          sin categoria_4 queda en el nodo '(sin asignar)' de su categoría
          de nivel 3.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_categoria')
                field: categoria_key
              config:
                severity: warn
      - name: venta_gs
        description: Venta neta del día, con las devoluciones en negativo.
        tests:
          - not_null
      - name: lineas
        description: Líneas de venta del día. Se suma entre niveles igual que venta_gs.
        tests:
          - not_null
