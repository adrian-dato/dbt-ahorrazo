version: 2

models:
  - name: ventas_rfm
    description: >
      Fuente de la segmentación RFM (rfm.py, repo customer-profiling, rama
      ahorrazo). Venta de 12 meses cerrados a grano de línea, con el segmento
      de Mayoristas de cada cliente como columna de agrupación. Las tablas de
      salida del RFM las escribe el script en este mismo schema.
    columns:
      - name: cliente_id_limpio
        tests:
          - not_null
      - name: ticket_id
        tests:
          - not_null
      - name: segmento_mayorista
        tests:
          - accepted_values:
              arguments:
                values: ['Mayoristas', 'Minoristas', 'Sin clasificar']

  - name: features_cluster
    description: >
      Entrada de la segmentación cualitativa (cluster.py, modo
      source_pivoted): una fila por cliente, una columna por feature. Columnas
      cat_ por cada categoría de nivel 3 que compra al menos el 1% de los
      clientes, más cat_(otras categorías), y pago_ por cada medio de pago.
      Valor: la parte de los tickets del cliente que incluye esa categoría o
      medio. La lista de columnas se recalcula en cada build.
    columns:
      - name: cliente_id_limpio
        tests:
          - not_null
          - unique
      - name: segmento_mayorista
        tests:
          - accepted_values:
              arguments:
                values: ['Mayoristas', 'Minoristas', 'Sin clasificar']
