version: 2

models:
  - name: int_clientes_normalizados
    description: >
      Limpieza de dbo.Clientes (equivalente KNIME), calculada una sola vez.
      Insumo de int_clientes_mapeo_limpio e int_clientes_limpio.
      cliente_id_limpio puede ser NULL acá (cliente no identificable, ej.
      un nombre de persona en vez de un documento) -- el filtro que excluye
      esos casos vive en los modelos consumidores, no acá.
    columns:
      - name: cliente_id
        tests:
          - not_null

  - name: int_clientes_mapeo_limpio
    description: >
      Reemplaza dbo.clientes_mapeo (proceso legacy clientes_mapeo_limpio.sql).
      Incremental: para detectar cliente_id nuevos en Ventas_Ahorrazo
      revisa los últimos {{ var('meses_lookback_incremental') }} meses
      cerrados más el mes en curso. Excluye clientes
      no identificables (cliente_id sin ningún dígito) -- no aparecen en
      esta tabla ni con cliente_id_limpio NULL. Fase 2 confirmada:
      stg_clientes_mapeo repunta acá (ya no a dbo.clientes_mapeo), así que
      alimenta a los 3 proyectos del portfolio a través de ese wrapper.
    columns:
      - name: cliente_id
        tests:
          - not_null
          - unique
      - name: cliente_id_limpio
        tests:
          - not_null

  - name: int_clientes_limpio
    description: >
      Reemplaza dbo.clientes_limpio (proceso legacy clientes_mapeo_limpio.sql).
      Excluye clientes no identificables, mismo criterio que
      int_clientes_mapeo_limpio. Fase 2 confirmada: stg_clientes_limpio
      repunta acá (ya no a dbo.clientes_limpio). tipo_persona reemplaza
      el CASE hardcodeado (prefijos '800'/'801'/'802') de
      view_ventas_ahorrazo_filtradas_12m -- ver comentario del modelo.
    columns:
      - name: cliente_id_limpio
        tests:
          - not_null
          - unique
      - name: tipo_persona
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'Fisico'
                  - 'Juridico'

  - name: int_productos_limpio
    description: >
      Única fuente de verdad de "producto elegible para análisis"
      (empresa, categoría_1/2, producto excluido) + categorías limpias.
      int_ventas_elegibles hace INNER JOIN acá en vez de repetir el
      filtro. categoria_4_limpio: fallback a categoria_3 cuando
      categoria_4 = 'sin asignar.' (placeholder real de la fuente).
    columns:
      - name: producto_id
        tests:
          - not_null
          - unique
      - name: categoria_4_limpio
        tests:
          - not_null

  - name: int_ventas_elegibles
    description: >
      Única fuente de verdad de "venta válida para análisis" -- unifica
      las reglas de exclusión (cliente de test del lado de la venta;
      empresa/categoría/producto excluido del lado del producto, vía
      int_productos_limpio) que antes vivían duplicadas en 3 lugares
      distintos entre los 3 proyectos. Hace join contra stg_clientes_mapeo,
      que desde la Fase 2 ya no lee de dbo.clientes_mapeo sino de
      int_clientes_mapeo_limpio -- se mantiene el join a través del
      wrapper (no directo a int_clientes_mapeo_limpio) porque ahí ya
      están hechos los casts a varchar(50) que este join necesita.
      tipo_persona calculado directo acá (misma macro que int_clientes_limpio,
      ver macros/clasificar_tipo_persona.sql) -- así cubre también a los
      clientes huérfanos, que int_clientes_limpio no tiene.
    columns:
      - name: producto_id
        tests:
          - not_null
      - name: pdv_id
        tests:
          - not_null
      - name: tipo_persona
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'Fisico'
                  - 'Juridico'
      - name: medio_pago
        description: >
          Pasa sin tocar desde stg_ventas -- ver ese modelo para el
          detalle (34 valores, atributo de línea, no se resuelve a nivel
          de ticket).

  - name: int_ventas_12m
    description: >
      Ventana móvil de 12 meses sobre int_ventas_elegibles -- COMPARTIDA
      entre Top 300 y Mayoristas (los 2 proyectos que dependen de la
      misma ventana en el legacy, view_ventas_ahorrazo_filtradas_12m).
      Rolling de verdad (calculado contra getdate(), no fechas fijas).
      Es una VISTA, así que recalcula su ventana cada vez que se la
      consulta: el primero de cada mes devuelve un período distinto sin
      que nadie haya corrido nada. Ningún modelo ni el tablero la
      consumen directo por eso -- todos leen int_ventas_12m_tabla. Queda
      para consultas a mano.
    columns:
      - name: producto_id
        tests:
          - not_null

  - name: int_ventas_12m_tabla
    description: >
      Las mismas filas que int_ventas_12m, materializadas. Es el modelo
      que consumen los 7 modelos de Mayoristas y Top 300 y la tabla
      Ventas del tablero de Power BI. Existe por dos motivos: congela la
      ventana entre corridas de dbt (la vista se mueve sola con el
      calendario, y eso desalineaba las tablas de marts_mayoristas contra
      la venta), y evita que cada consumidor vuelva a recorrer la cadena
      de vistas sobre dbo.Ventas_Ahorrazo (238M+ filas) -- de 8 recorridos
      por corrida a uno solo. No repite el filtro de la ventana: lee la
      vista entera, así la regla sigue viviendo solo en el macro
      fecha_corte_mes_cerrado().
    columns:
      - name: cliente_id_limpio
        description: >
          Puede venir nulo -- son las ventas de clientes que existen en
          Ventas pero no en la tabla de Clientes. No lleva not_null a
          propósito.
      - name: producto_id
        tests:
          - not_null
      - name: fecha_venta
        tests:
          - not_null
      - name: ticket_id
        tests:
          - not_null
      - name: medio_pago
        description: >
          Pasa sin tocar desde int_ventas_elegibles -- 34 valores, 401
          filas en NULL sobre 238M+ en la fuente. Es la columna que
          expone la tabla Ventas del tablero de Power BI para poder
          filtrar por medio de pago.

  - name: int_ventas_24m_tabla
    description: >
      Lo mismo que int_ventas_12m_tabla -- grano de línea, mismas
      exclusiones, ventana de meses cerrados -- pero mirando 24 meses en
      vez de 12. Existe para las preguntas de tendencia interanual, que
      con una ventana de 12 meses no se pueden contestar porque la
      ventana entera es el año: no hay período anterior contra el cual
      comparar. A diferencia de fct_ventas_agrupadas_24m, que también
      cubre 24 meses pero ya viene agregada a mes x cliente x sucursal x
      categoría x marca, esta conserva producto_id y unidad_medida, así
      que permite bajar a producto y separar kilos de unidades. No la
      construye ningún DAG: no está tagueada y ningún modelo le hace ref,
      se materializa solo cuando se la selecciona a propósito.
    columns:
      - name: cliente_id_limpio
        description: >
          Puede venir nulo, igual que en int_ventas_12m_tabla -- son
          ventas de clientes que existen en Ventas pero no en la tabla de
          Clientes. No lleva not_null a propósito.
      - name: producto_id
        tests:
          - not_null
      - name: fecha_venta
        tests:
          - not_null
      - name: ticket_id
        tests:
          - not_null
