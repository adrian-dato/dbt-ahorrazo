version: 2

models:
  - name: int_clientes_normalizados
    description: >
      Limpieza de dbo.Clientes (equivalente KNIME), calculada una sola vez.
      Insumo de int_clientes_mapeo_limpio e int_clientes_limpio.
      cliente_id_limpio puede ser NULL acá (cliente no identificable, ej.
      un nombre de persona en vez de un documento) -- el filtro que excluye
      esos casos vive en los modelos consumidores, no acá.
    columns:
      - name: cliente_id
        tests:
          - not_null

  - name: int_clientes_mapeo_limpio
    description: >
      Reemplaza dbo.clientes_mapeo (proceso legacy clientes_mapeo_limpio.sql).
      Incremental, lookback de {{ var('dias_lookback_incremental') }} días
      para detectar cliente_id nuevos en Ventas_Ahorrazo. Excluye clientes
      no identificables (cliente_id sin ningún dígito) -- no aparecen en
      esta tabla ni con cliente_id_limpio NULL. Corre en paralelo al
      proceso legacy -- todavía no lo reemplaza como source de ningún mart.
    columns:
      - name: cliente_id
        tests:
          - not_null
          - unique
      - name: cliente_id_limpio
        tests:
          - not_null

  - name: int_clientes_limpio
    description: >
      Reemplaza dbo.clientes_limpio (proceso legacy clientes_mapeo_limpio.sql).
      Excluye clientes no identificables, mismo criterio que
      int_clientes_mapeo_limpio. Corre en paralelo al proceso legacy --
      todavía no lo reemplaza como source de ningún mart. tipo_persona
      reemplaza el CASE hardcodeado (prefijos '800'/'801'/'802') de
      view_ventas_ahorrazo_filtradas_12m -- ver comentario del modelo.
    columns:
      - name: cliente_id_limpio
        tests:
          - not_null
          - unique
      - name: tipo_persona
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'Fisico'
                  - 'Juridico'

  - name: int_productos_limpio
    description: >
      Única fuente de verdad de "producto elegible para análisis"
      (empresa, categoría_1/2, producto excluido) + categorías limpias.
      int_ventas_elegibles hace INNER JOIN acá en vez de repetir el
      filtro. categoria_4_limpio: fallback a categoria_3 cuando
      categoria_4 = 'sin asignar.' (placeholder real de la fuente).
    columns:
      - name: producto_id
        tests:
          - not_null
          - unique
      - name: categoria_4_limpio
        tests:
          - not_null

  - name: int_ventas_elegibles
    description: >
      Única fuente de verdad de "venta válida para análisis" -- unifica
      las reglas de exclusión (cliente de test del lado de la venta;
      empresa/categoría/producto excluido del lado del producto, vía
      int_productos_limpio) que antes vivían duplicadas en 3 lugares
      distintos entre los 3 proyectos. Usa stg_clientes_mapeo (legacy),
      no int_clientes_mapeo_limpio todavía -- ver PENDIENTES.md.
      tipo_persona calculado directo acá (misma macro que int_clientes_limpio,
      ver macros/clasificar_tipo_persona.sql) -- así cubre también a los
      clientes huérfanos, que int_clientes_limpio no tiene.
    columns:
      - name: producto_id
        tests:
          - not_null
      - name: pdv_id
        tests:
          - not_null
      - name: tipo_persona
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'Fisico'
                  - 'Juridico'

  - name: int_ventas_12m
    description: >
      Ventana móvil de 12 meses sobre int_ventas_elegibles -- COMPARTIDA
      entre Top 300 y Mayoristas (los 2 proyectos que dependen de la
      misma ventana en el legacy, view_ventas_ahorrazo_filtradas_12m).
      Rolling de verdad (calculado contra getdate(), no fechas fijas).
    columns:
      - name: producto_id
        tests:
          - not_null
