version: 2

models:
  - name: int_clientes_normalizados
    description: >
      Limpieza de dbo.Clientes (equivalente KNIME), calculada una sola vez.
      Insumo de int_clientes_mapeo_limpio e int_clientes_limpio.
      cliente_id_limpio puede ser NULL acá (cliente no identificable, ej.
      un nombre de persona en vez de un documento) -- el filtro que excluye
      esos casos vive en los modelos consumidores, no acá.
    columns:
      - name: cliente_id
        tests:
          - not_null

  - name: int_clientes_mapeo_limpio
    description: >
      El mapeo cliente_id -> cliente_id_limpio. Reemplaza a
      dbo.clientes_mapeo, que construía el proceso anterior
      (clientes_mapeo_limpio.sql). Incluye a los clientes de dbo.Clientes y
      a los cliente_id que aparecen en ventas pero no tienen ficha. Es
      incremental: para detectar cliente_id nuevos en Ventas_pos
      revisa los últimos {{ var('meses_lookback_incremental') }} meses
      cerrados más el mes en curso. Excluye clientes no identificables
      (cliente_id sin ningún dígito) -- no aparecen en esta tabla ni con
      cliente_id_limpio NULL. Alimenta a los 3 proyectos del portfolio.
    columns:
      - name: cliente_id
        tests:
          - not_null
          - unique
      - name: cliente_id_limpio
        tests:
          - not_null

  - name: int_clientes_limpio
    description: >
      Una fila por cliente_id_limpio con nombre, documento, celular, mail y
      tipo_persona. Reemplaza a dbo.clientes_limpio, que construía el
      proceso anterior (clientes_mapeo_limpio.sql). Solo incluye a los
      clientes que tienen ficha en dbo.Clientes: los que aparecen en ventas
      sin ficha no están. Excluye clientes no identificables, mismo
      criterio que int_clientes_mapeo_limpio. tipo_persona reemplaza el CASE
      hardcodeado (prefijos '800'/'801'/'802') de
      view_ventas_ahorrazo_filtradas_12m -- ver comentario del modelo.
    columns:
      - name: cliente_id_limpio
        tests:
          - not_null
          - unique
      - name: tipo_persona
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'Fisico'
                  - 'Juridico'

  - name: int_productos_limpio
    description: >
      Única fuente de verdad de "producto elegible para análisis"
      (empresa, categoría_1/2, producto excluido) + categorías limpias.
      int_ventas_elegibles hace INNER JOIN acá en vez de repetir el
      filtro. categoria_4_limpio: fallback a categoria_3 cuando
      categoria_4 = 'sin asignar.' (placeholder real de la fuente).
    columns:
      - name: producto_id
        tests:
          - not_null
          - unique
      - name: categoria_4_limpio
        description: >
          No sirve como identificador de categoría: mezcla los nombres de
          categoria_4 con los de categoria_3 donde esa falta. Para agrupar
          por categoría usar categoria_key_n1 a categoria_key_n4.
        tests:
          - not_null
      - name: categoria_key_n1
        description: Clave de la categoría de nivel 1 del producto (ver dim_categoria).
        tests:
          - not_null
      - name: categoria_key_n2
        description: Clave de la categoría de nivel 2 del producto, por ruta completa.
        tests:
          - not_null
      - name: categoria_key_n3
        description: Clave de la categoría de nivel 3 del producto, por ruta completa.
        tests:
          - not_null
      - name: categoria_key_n4
        description: >
          Clave de la categoría de nivel 4 del producto, por ruta completa.
          Un producto sin categoria_4 queda en un nodo '(sin asignar)' bajo
          su categoría de nivel 3.
        tests:
          - not_null

  - name: int_ventas_elegibles
    description: >
      Única fuente de verdad de "venta válida para análisis" -- unifica
      las reglas de exclusión (cliente de test del lado de la venta;
      empresa/categoría/producto excluido del lado del producto, vía
      int_productos_limpio) que antes vivían duplicadas en 3 lugares
      distintos entre los 3 proyectos. Hace join contra stg_clientes_mapeo
      (no directo contra int_clientes_mapeo_limpio) porque esa vista tiene
      hechos los casts a varchar(50) que este join necesita.
      tipo_persona calculado directo acá (misma macro que int_clientes_limpio,
      ver macros/clasificar_tipo_persona.sql) -- así cubre también a los
      clientes huérfanos, que int_clientes_limpio no tiene.
    columns:
      - name: producto_id
        tests:
          - not_null
      - name: pdv_id
        tests:
          - not_null
      - name: tipo_persona
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'Fisico'
                  - 'Juridico'
      - name: medio_pago
        description: >
          Pasa sin tocar desde stg_ventas -- ver ese modelo para el
          detalle (34 valores, atributo de línea, no se resuelve a nivel
          de ticket).

  - name: int_ventas_12m_tabla
    description: >
      La venta de los últimos 12 meses cerrados a grano de línea,
      materializada. La comparten Top 300 y Mayoristas (siete modelos) y es
      la tabla Ventas del tablero de Power BI. Es una tabla y no una vista
      por dos motivos: congela la ventana entre corridas de dbt (una vista
      se movería sola con el calendario y desalinearía las tablas de
      marts_mayoristas contra la venta), y evita que cada consumidor vuelva
      a recorrer la cadena sobre dbo.Ventas_pos (238M+ filas). Lee
      int_ventas_elegibles directo y lista sus columnas: una columna nueva
      en ese modelo hay que agregarla acá y en int_ventas_24m_tabla.
    columns:
      - name: cliente_id_limpio
        description: >
          Puede venir nulo -- son las ventas de clientes que existen en
          Ventas pero no en la tabla de Clientes. No lleva not_null a
          propósito.
      - name: producto_id
        tests:
          - not_null
      - name: fecha_venta
        tests:
          - not_null
      - name: ticket_id
        tests:
          - not_null
      - name: medio_pago
        description: >
          Pasa sin tocar desde int_ventas_elegibles -- 34 valores, 401
          filas en NULL sobre 238M+ en la fuente. Es la columna que
          expone la tabla Ventas del tablero de Power BI para poder
          filtrar por medio de pago.

  - name: int_ventas_24m_tabla
    description: >
      Lo mismo que int_ventas_12m_tabla -- grano de línea, mismas
      exclusiones, ventana de meses cerrados -- pero mirando 24 meses en
      vez de 12. Existe para las preguntas de tendencia interanual, que
      con una ventana de 12 meses no se pueden contestar porque la
      ventana entera es el año: no hay período anterior contra el cual
      comparar. A diferencia de fct_ventas_agrupadas_24m, que también
      cubre 24 meses pero ya viene agregada a mes x cliente x sucursal x
      categoría x marca, esta conserva producto_id y unidad_medida, así
      que permite bajar a producto y separar kilos de unidades. No la
      construye ningún DAG: no está tagueada y ningún modelo le hace ref,
      se materializa solo cuando se la selecciona a propósito.
    columns:
      - name: cliente_id_limpio
        description: >
          Puede venir nulo, igual que en int_ventas_12m_tabla -- son
          ventas de clientes que existen en Ventas pero no en la tabla de
          Clientes. No lleva not_null a propósito.
      - name: producto_id
        tests:
          - not_null
      - name: fecha_venta
        tests:
          - not_null
      - name: ticket_id
        tests:
          - not_null
