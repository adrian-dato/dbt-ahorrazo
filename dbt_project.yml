name: 'dbt_ahorrazo'
version: '1.0.0'
config-version: 2

profile: 'dbt_ahorrazo'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Repo compartido por los 3 proyectos del portfolio (ver
# PLAN_MAESTRO_REINGENIERIA.md en la raíz de proyectos/). staging/ e
# intermediate/ son de fuente única, consumidos por los 3 marts.
# Cada modelo de marts/<proyecto> se tagea con el nombre del proyecto
# para poder correr `dbt build --select tag:<proyecto>` desde el DAG
# de Airflow correspondiente, sin acoplar los 3 pipelines entre sí.
vars:
  # Canibalización — coincide con @meses = 36 en proc_1_36m.sql (legacy)
  meses_ventana_canibalizacion: 36
  dias_lookback_incremental: 45

  # Compartida entre Top 300 y Mayoristas -- los 2 proyectos que hoy
  # dependen de la misma ventana (view_ventas_ahorrazo_filtradas_12m en
  # el legacy). Ver models/intermediate/int_ventas_12m.sql -- un solo
  # modelo, no una copia del filtro por proyecto.
  ventana_meses_12m: 12

  # Top 300 — pesos del Puntaje Final
  top300_peso_ventas: 0.40
  top300_peso_tickets: 0.30
  top300_peso_unidades_dia: 0.20
  top300_peso_unidades_ticket: 0.10
  top300_umbral_ventas_gs: 5000000

  # Mayoristas — piso mínimo para el criterio C2 (% tickets grandes).
  # PCT_GRANDES_MINIMO en analisis_mayoristas_v2.ipynb -- el comentario
  # del notebook dice "30%" pero el valor real usado en el código es
  # 0.40; se porta el valor real, no el comentario desactualizado.
  mayoristas_pct_grandes_minimo: 0.40

  # Canibalización v3 -- metodología de eventos de migración
  # (canibalizacion_v3.py), independiente de meses_ventana_canibalizacion
  # (36 meses, usado por dim_cliente_tipo_migracion/v1). Mismos valores
  # que VENTANA_MESES/MESES_MIGRACION en el script.
  canibalizacion_v3_ventana_meses: 24
  canibalizacion_v3_meses_migracion: 3

# Sin esto, dbt infiere producto_id como int a partir del CSV (todo
# dígitos) -- y como producto_id real en la base no es puramente
# numérico ("1685-G", ni cabe siempre en int, ej. "7506295378"), un JOIN
# contra esa columna int explota (SQL Server intenta convertir el otro
# lado a int primero, por precedencia de tipos). Ver stg_ventas.sql.
#
# +schema acá y en models/ abajo: un schema de base de datos por capa
# (y uno por proyecto dentro de marts/), en vez de todo apilado en un
# solo schema. Nombres limpios, sin prefijo de entorno -- ver
# macros/generate_schema_name.sql para la razón (dev/prod comparten la
# misma base, el prefijo no daba aislamiento real).
seeds:
  dbt_ahorrazo:
    +schema: seeds
    productos_excluidos:
      +column_types:
        producto_id: varchar(50)

models:
  dbt_ahorrazo:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +schema: intermediate
      # Sin +materialized: no todos los modelos de intermediate/ tocan la
      # fact de 238M+ filas (ej. la dimensión de clientes es chica y
      # alcanza con `table`) -- cada modelo declara su propia
      # materialización con {{ config(...) }}.
    marts:
      canibalizacion:
        +materialized: table
        +tags: ["canibalizacion"]
        +schema: marts_canibalizacion
      top_300:
        +materialized: table
        +tags: ["top_300"]
        +schema: marts_top_300
      mayoristas:
        +materialized: table
        +tags: ["mayoristas"]
        +schema: marts_mayoristas
